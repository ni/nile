# The root is a squashfs mounted directly, with no initramfs.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_LZO=y

# g_lci and its ChipIdea UDC are built in so the g_lci.* boot options apply.
# The UDC needs the usb-nop-xceiv PHY.
CONFIG_USB_GADGET=y
CONFIG_USB_CHIPIDEA=y
CONFIG_USB_CHIPIDEA_UDC=y
CONFIG_USB_ULPI_BUS=y
CONFIG_USB_CHIPIDEA_ULPI=y
CONFIG_NOP_USB_XCEIV=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_F_HID_BULK=y
CONFIG_USB_F_MASS_STORAGE=y
CONFIG_USB_G_LCI=y

# The LCI daemon drives the FPGA through /dev/uio0 (uio_lci).
CONFIG_UIO=y
CONFIG_UIO_LCI=y

# Zynq SWDT for the daemon, nowayout.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_WATCHDOG_NOWAYOUT=y
CONFIG_CADENCE_WATCHDOG=y

# systemd-networkd needs network namespaces.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
