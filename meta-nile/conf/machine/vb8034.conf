#@TYPE: Machine
#@NAME: vb8034
#@DESCRIPTION: Machine support for the NI VB-8034 (VirtualBench 2)

#### Preamble
MACHINEOVERRIDES =. "${@['', 'vb8034:']['vb8034' !='${MACHINE}']}"
#### Regular settings follow

require conf/machine/zynq-generic.conf

# glibc 2.39 must target the legacy 3.2 kernel (its minimum); otherwise modern
# syscalls (statx, *_time64) return ENOSYS at runtime and every binary fails.
OLDEST_KERNEL = "3.2.0"

# VB-8034 uses the legacy Zynq boot flow, but its DAQ hardware export is from
# Vivado 2015.4 and cannot be consumed by the XSCT version in this build.
# Use the static DAQ boot artifacts and the matching NI Linux device tree.
XILINX_WITH_ESW = ""
PREFERRED_VERSION_linux-xlnx:vb8034 = "3.2%"
KERNEL_DEVICETREE:vb8034 = "ni-vb80x4.dtb"
IMAGE_BOOT_FILES:append:vb8034 = " boot.bin"
EXTRA_IMAGEDEPENDS:append:vb8034 = " virtual/boot-bin"

# FSBL and boot bitstream come from the ni-lci feed's lci-boot-inputs IPK, staged
# into the sysroot by the lci-boot-inputs recipe (built from ni-central
# lci-legacy-artifacts). fsbl/bitstream read them via ${STAGING_DATADIR}.
FSBL_FILE:vb8034 = "${STAGING_DATADIR}/lci-boot-inputs/VB8034_fsbl"
BITSTREAM_PATH:vb8034 = "${STAGING_DATADIR}/lci-boot-inputs/vb8012_synth.bit"
DEPENDS:append:pn-fsbl = " lci-boot-inputs"
BITSTREAM_PATH_DEPENDS = "lci-boot-inputs"
PREFERRED_PROVIDER_virtual/fsbl:vb8034 = "fsbl"
PREFERRED_PROVIDER_virtual/bitstream:vb8034 = "bitstream"
BIF_BITSTREAM_ATTR:vb8034 = "bitstream"

# xilinx-bootbin consumes the kernel DTB from the kernel deploy directory.
BIF_PARTITION_IMAGE[device-tree] = "${DEPLOY_DIR_IMAGE}/ni-vb80x4.dtb"
DEPENDS:remove:pn-xilinx-bootbin = "device-tree"

UBOOT_MACHINE = "nilci_VB8034"

# LCI update-bundle identity (consumed by nile-image-lci.bb do_bundle). These are
# device-specific: DeviceCode must match the shipped U-Boot env exactly.
MANIFEST_TARGETCLASS ?= "VirtualBench"
MANIFEST_DEVICECODE ?= "0x77DE"
MANIFEST_DEVICEDESC ?= "NI VB-8034"
LCI_BUNDLE_NAME ?= "VB-8034.cfg"

# --- Legacy update contract (shipped devices, fixed U-Boot) ---------------
# Shipped devices boot a FIT lci.itb from UBI, mount a read-only root.squashfs,
# and use a fixed NAND/UBI geometry. Reproduce that contract here.

# The FIT embeds the RAW kernel Image (u-boot 'bootm' supplies the header at
# load 0x8000); uImage is not used inside the FIT.
KERNEL_IMAGETYPES:append:vb8034 = " Image"

# Root delivered as read-only squashfs (copied into tmpfs at early boot).
# Legacy mksquashfs flags: -all-root -xattrs -comp lzo.
IMAGE_FSTYPES:append:vb8034 = " squashfs"
SQUASHFS_COMPRESSION_TYPE:vb8034 = "lzo"
EXTRA_IMAGECMD:squashfs:append:vb8034 = " -all-root -xattrs"

# LCI NAND UBI geometry: 2KB min I/O, 126KB LEB (128KB PEB - 2KB), <=250 LEBs.
MKUBIFS_ARGS:vb8034 = "-m 2048 -e 129024 -c 250"
UBINIZE_ARGS:vb8034 = "-m 2048 -p 128KiB"

# Build the legacy-compatible FIT (lci-kernel.itb) and bootfs UBI volume
# alongside any vb8034 image.
EXTRA_IMAGEDEPENDS:append:vb8034 = " lci-fitimage"

### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' vb8034']['vb8034' != '${MACHINE}']}"
