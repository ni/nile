header:
  version: 19
  includes:
    - kas/includes/meta-xilinx.yml
    - kas/includes/meta-virtualization.yml
    - kas/includes/xilinx-device-common.yml

machine: amd-cortexa9thf-neon-common

local_conf_header:
  xilinx-esw: |
    XILINX_XSCT_VERSION = "2025.1"
    XILINX_WITH_ESW = "xsct"

repos:
  meta-xilinx:
    layers:
      meta-xilinx-core:
      meta-xilinx-bsp:
      meta-microblaze:
      meta-xilinx-multimedia:
      meta-xilinx-standalone:
      meta-xilinx-standalone-sdt:
